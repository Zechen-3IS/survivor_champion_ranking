name: Update rankings

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: survivor-ranking
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and generate HTML
        run: python -m survivor

      - name: Commit and push HTML
        run: |
          chmod +x .github/scripts/push-generated.sh
          .github/scripts/push-generated.sh "自动更新幸存者排名" \
            index.html \
            atp_ranking.html \
            wta_ranking.html \
            atp_instant_ranking.html \
            wta_instant_ranking.html \
            combined_ranking.html \
            combined_instant_ranking.html

  next:
    name: Queue next half hour
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait until next :00 or :30 UTC
        run: |
          python3 - <<'PY'
          import time
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          if now.minute < 30:
              target = now.replace(minute=30, second=8, microsecond=0)
          else:
              target = now.replace(minute=0, second=8, microsecond=0) + timedelta(hours=1)
          delay = (target - now).total_seconds()
          if delay < 45:
              target += timedelta(minutes=30)
              delay = (target - now).total_seconds()
          print(f"now={now.isoformat()} target={target.isoformat()} sleep={delay:.0f}s", flush=True)
          time.sleep(delay)
          PY

      - name: Dispatch next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/update-rankings.yml/dispatches" \
            -f ref="${{ github.event.repository.default_branch }}"
