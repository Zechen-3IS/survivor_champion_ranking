name: Update rankings

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: survivor-ranking
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and generate HTML
        run: python -m survivor

      - name: Commit and push HTML
        run: |
          chmod +x .github/scripts/push-generated.sh
          .github/scripts/push-generated.sh "自动更新幸存者排名" \
            index.html \
            atp_ranking.html \
            wta_ranking.html \
            atp_instant_ranking.html \
            wta_instant_ranking.html \
            combined_ranking.html \
            combined_instant_ranking.html
