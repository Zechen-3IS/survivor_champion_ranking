name: Update player stats

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: survivor-player-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Incremental player stats
        run: python -m survivor --stats

      - name: Commit and push stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -- atp_show.html wta_show.html data/player_events.json
          if git diff --cached --quiet; then
            echo "stats unchanged"
            exit 0
          fi
          git commit -m "每周更新球员成绩统计"
          git pull --rebase --autostash origin main
          git push
